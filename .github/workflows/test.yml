name: Backend Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install langchain-google-genai aiosqlite anyio

      - name: Verify Docker is available
        run: docker --version && docker ps

      - name: Pull sandbox image (so tests don't time out pulling it)
        run: docker pull python:3.10-alpine

      - name: Run tests
        working-directory: ./backend
        env:
          PYTHONPATH: src
          # GOOGLE_API_KEY is only needed for LangGraph agent tests
          # All our tests pre-inject generated_code so they skip the LLM
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          pytest tests/ -v --tb=short
